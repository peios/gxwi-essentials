[package]
name = "gxwi-file-dialog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "gxwi-file-dialog"
path = "src/main.rs"
required-features = ["program"]

[features]
default = ["program"]
program = ["dep:gxwi", "dep:libc", "dep:peios", "dep:jiff"]

[dependencies]
gxwi-fs.workspace = true
jiff = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
gxwi = { workspace = true, optional = true }
peios = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
