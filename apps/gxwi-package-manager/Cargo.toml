[package]
name = "gxwi-package-manager"
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# Beside this checkout until a libgxwi with the settings kit is released.
libgxwi = { path = "../gxwi/libgxwi" }
# Choosing a package file to install.
gxwi-file-dialog = { git = "https://github.com/peios/gxwi-file-dialog.git", rev = "02cfa53c42631bcda35f916e275bbd471f2f72d3", default-features = false }
# peipkg's answers, which are JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# When something was installed, in words.
jiff = "0.2.29"
