[package]
name = "gxwi-package-manager"
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# libgxwi as of the gxwi release dev.peios.gxwi-sdk stages, which a package
# build takes it from (gxwi's dev/pins.toml).
libgxwi = { git = "https://github.com/peios/gxwi.git", rev = "e9d86e56e8d79b4240ff5114434b4cdc0c5b1f76" }
# Choosing a package file to install.
gxwi-file-dialog = { git = "https://github.com/peios/gxwi-file-dialog.git", rev = "a130824c76d60c72a801112322c33257858bc1d8", default-features = false }
# peipkg's answers, which are JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# When something was installed, in words.
jiff = "0.2.29"
