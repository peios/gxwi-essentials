[package]
name = "peiterm"
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
libgxwi = { git = "https://github.com/peios/gxwi.git", rev = "02d33c3036327dad6971fa509d1e9492e8258c55" }
# What the page is served with and spoken to over, the same as libgxwi's.
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.53.1", features = ["sync"] }
libc = "0.2"
serde_json = "1"
# The terminal as it stands, kept here so that a page that comes later is
# shown it.
vt100 = "0.16"
