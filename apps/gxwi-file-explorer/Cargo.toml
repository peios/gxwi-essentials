[package]
name = "gexora"
version = "0.0.2"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
libgxwi = { git = "https://github.com/peios/gxwi.git", rev = "25d43045f02fab59e4606eec616cdb1a285ebd91" }
libc = "0.2"
# Times, in the machine's time zone.
jiff = "0.2.29"
# A file's descriptor, read and applied for the permissions editor.
peios = { git = "https://github.com/peios/peios-rs.git", rev = "02c87cb643c30eef6b74cd1d9d8b0ae067bed69a", package = "peios" }
# The permissions editor's protocol, and nothing of the editor's own, and
# pushing a folder's permissions into what is inside it. Beside this
# checkout until it is published.
gxwi-sd-editor = { path = "../gxwi-sd-editor", default-features = false, features = ["propagate"] }
