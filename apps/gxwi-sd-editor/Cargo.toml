[package]
name = "gxwi-sd-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "gxwi-sd-editor"
path = "src/main.rs"
required-features = ["program"]

[features]
default = ["program"]
program = ["names", "dep:libgxwi", "dep:libc", "dep:sha1"]
names = ["dep:peios", "dep:auth-core"]
splice = ["dep:peios"]
registry = ["dep:peios"]
propagate = ["dep:peios"]

[dependencies]
auth-core = { workspace = true, optional = true, features = ["client"] }
base64 = { workspace = true }
libc = { workspace = true, optional = true }
libgxwi = { workspace = true, optional = true }
peios = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = { workspace = true, optional = true }
