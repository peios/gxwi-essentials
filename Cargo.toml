[workspace]
resolver = "3"
members = [
    "vendor/kernel/peios/rust/ntfe",
    "vendor/kernel/peios/rust/pnp-core",
    "vendor/kernel/peios/rust/peios-uapi",
    "crates/gxwi-fs",
    "crates/gxwi-process",
    "apps/gxwi-disk-manager",
    "apps/gxwi-event-viewer",
    "apps/gxwi-feature-manager",
    "apps/gxwi-file-dialog",
    "apps/gxwi-file-explorer",
    "apps/gxwi-my-settings",
    "apps/gxwi-network-manager",
    "apps/gxwi-package-manager",
    "apps/gxwi-principals-manager",
    "apps/gxwi-registry-editor",
    "apps/gxwi-sd-editor",
    "apps/gxwi-security-policy",
    "apps/gxwi-services-manager",
    "apps/gxwi-system-settings",
    "apps/gxwi-task-manager",
    "apps/gxwi-terminal",
    "apps/gxwi-text-editor",
    "apps/gxwi-upgrade-peios",
]
exclude = ["vendor/ppk"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"

[workspace.dependencies]
gxwi-fs = { path = "crates/gxwi-fs" }
gxwi-process = { path = "crates/gxwi-process" }
auth-core = { git = "https://github.com/peios/authd.git", rev = "ea3c9f90c48052ff0c0757d88032c9c706964b9a" }
auth-policy = { git = "https://github.com/peios/authd.git", rev = "ea3c9f90c48052ff0c0757d88032c9c706964b9a" }
axum = { version = "0.8.9" }
base64 = { version = "0.22" }
eventd-client = { git = "https://github.com/peios/eventd.git", rev = "0a660940aaf451f1335c5f483de59afb36d6ebf6" }
gxwi-file-dialog = { path = "apps/gxwi-file-dialog", default-features = false }
gxwi-sd-editor = { path = "apps/gxwi-sd-editor", default-features = false }
jiff = { version = "0.2.29" }
libc = { version = "0.2" }
gxwi = { git = "https://github.com/peios/gxwi.git", rev = "dd54c32e6b7450726fd1e362986a623a1dd15b0f" }
netd-client = { git = "https://github.com/peios/netd.git", rev = "09927d27df2d4294a38e8dd083f0ec1ea5d3813e" }
resolvd-client = { git = "https://github.com/peios/resolvd.git", rev = "d714ec7f364950920fd9a83565d47fc8fb08dd38" }
timed-client = { git = "https://github.com/peios/timed.git", rev = "2111f10f37508ffcf4221c285b6c3e44f6bd3e40" }
ntfe = { path = "vendor/kernel/peios/rust/ntfe" }
peinit2 = { git = "https://github.com/peios/peinit.git", rev = "0eb973544a96bbd1de6984198113ed5ab2bd98e7", default-features = false }
peios = { git = "https://github.com/peios/peios-rs.git", rev = "3950d35950c46cb3538885b7cf05bde059393def", package = "peios" }
peios-reg = { git = "https://github.com/peios/peiosutils.git", rev = "8cdd9c074616fe37d356a995c228c38f9379e9ff" }
peios-regman = { git = "https://github.com/peios/peiosutils.git", rev = "8cdd9c074616fe37d356a995c228c38f9379e9ff" }
pnp-core = { path = "vendor/kernel/peios/rust/pnp-core" }
serde = { version = "1" }
serde_json = { version = "1" }
session-preferences = { git = "https://github.com/peios/authd.git", rev = "ea3c9f90c48052ff0c0757d88032c9c706964b9a" }
sha1 = { version = "0.10" }
tokio = { version = "1.53.1" }
trust-client = { git = "https://github.com/peios/trustd.git", rev = "0e93013457503e30d30e4898b93aa538941ab2da" }
vt100 = { version = "0.16" }

[patch."https://github.com/peios/pkm.git"]
pnp-core = { path = "vendor/kernel/peios/rust/pnp-core" }
ntfe = { path = "vendor/kernel/peios/rust/ntfe" }
peios-uapi = { path = "vendor/kernel/peios/rust/peios-uapi" }
