[workspace]
resolver = "3"
members = [
    "vendor/kernel/peios/rust/ntfe",
    "vendor/kernel/peios/rust/pnp-core",
    "vendor/kernel/peios/rust/peios-uapi",
    "crates/gxwi-fs",
    "crates/gxwi-process",
    "apps/gxwi-disk-manager",
    "apps/gxwi-event-viewer",
    "apps/gxwi-feature-manager",
    "apps/gxwi-file-dialog",
    "apps/gxwi-file-explorer",
    "apps/gxwi-my-settings",
    "apps/gxwi-network-manager",
    "apps/gxwi-package-manager",
    "apps/gxwi-principals-manager",
    "apps/gxwi-registry-editor",
    "apps/gxwi-sd-editor",
    "apps/gxwi-security-policy",
    "apps/gxwi-services-manager",
    "apps/gxwi-system-settings",
    "apps/gxwi-task-manager",
    "apps/gxwi-terminal",
    "apps/gxwi-text-editor",
    "apps/gxwi-upgrade-peios",
]
exclude = ["vendor/ppk"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"

[workspace.dependencies]
gxwi-fs = { path = "crates/gxwi-fs" }
gxwi-process = { path = "crates/gxwi-process" }
auth-core = { git = "https://github.com/peios/authd.git", rev = "af3f0df00b94bf578b27788fc2682d795fe46505" }
auth-policy = { git = "https://github.com/peios/authd.git", rev = "af3f0df00b94bf578b27788fc2682d795fe46505" }
axum = { version = "0.8.9" }
base64 = { version = "0.22" }
eventd-client = { git = "https://github.com/peios/eventd.git", rev = "ee5117a7efd8099691a933dc1b5f6428ea108473" }
gxwi-file-dialog = { path = "apps/gxwi-file-dialog", default-features = false }
gxwi-sd-editor = { path = "apps/gxwi-sd-editor", default-features = false }
jiff = { version = "0.2.29" }
libc = { version = "0.2" }
gxwi = { git = "https://github.com/peios/gxwi.git", rev = "a8a92eb6f9127319310b3f8ad2c31f436a1f9281" }
netd-client = { git = "https://github.com/peios/netd.git", rev = "a8115af3c8d1bf69732eb4214dacf8cf9aee19d8" }
resolvd-client = { git = "https://github.com/peios/resolvd.git", rev = "9c907dff26a3ccaa1035b17edfa12069de8ce883" }
timed-client = { git = "https://github.com/peios/timed.git", rev = "313e58994ba282bd77553e31e10ab2300c6cfc7a" }
ntfe = { path = "vendor/kernel/peios/rust/ntfe" }
peinit2 = { git = "https://github.com/peios/peinit.git", rev = "f03f61759a2cd7941e84452984ba0e1b613d1559", default-features = false }
peios = { git = "https://github.com/peios/peios-rs.git", rev = "ebb1e39ca99ae8371dd9e8dc45844feb474d056c", package = "peios" }
peios-reg = { git = "https://github.com/peios/peiosutils.git", rev = "a1b26e51d7c94a4dadc7a1bc4a5aacb99a6110b5" }
peios-regman = { git = "https://github.com/peios/peiosutils.git", rev = "a1b26e51d7c94a4dadc7a1bc4a5aacb99a6110b5" }
pnp-core = { path = "vendor/kernel/peios/rust/pnp-core" }
serde = { version = "1" }
serde_json = { version = "1" }
session-preferences = { git = "https://github.com/peios/authd.git", rev = "af3f0df00b94bf578b27788fc2682d795fe46505" }
sha1 = { version = "0.10" }
tokio = { version = "1.53.1" }
trust-client = { git = "https://github.com/peios/trustd.git", rev = "bd34989f99b167b072b4edb5fbfd0f68cb915702" }
vt100 = { version = "0.16" }

[patch."https://github.com/peios/pkm.git"]
pnp-core = { path = "vendor/kernel/peios/rust/pnp-core" }
ntfe = { path = "vendor/kernel/peios/rust/ntfe" }
peios-uapi = { path = "vendor/kernel/peios/rust/peios-uapi" }
