[workspace]
resolver = "3"
members = [
    "vendor/kernel/peios/rust/ntfe",
    "vendor/kernel/peios/rust/pnp-core",
    "vendor/kernel/peios/rust/peios-uapi",
    "crates/gxwi-fs",
    "crates/gxwi-process",
    "apps/gxwi-disk-manager",
    "apps/gxwi-event-viewer",
    "apps/gxwi-feature-manager",
    "apps/gxwi-file-dialog",
    "apps/gxwi-file-explorer",
    "apps/gxwi-my-settings",
    "apps/gxwi-network-manager",
    "apps/gxwi-package-manager",
    "apps/gxwi-principals-manager",
    "apps/gxwi-registry-editor",
    "apps/gxwi-sd-editor",
    "apps/gxwi-security-policy",
    "apps/gxwi-services-manager",
    "apps/gxwi-system-settings",
    "apps/gxwi-task-manager",
    "apps/gxwi-terminal",
    "apps/gxwi-text-editor",
    "apps/gxwi-upgrade-peios",
]
exclude = ["vendor/ppk"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"

[workspace.dependencies]
gxwi-fs = { path = "crates/gxwi-fs" }
gxwi-process = { path = "crates/gxwi-process" }
auth-core = { git = "https://github.com/peios/authd.git", rev = "327ce68648e1594331c88a457afb261f9000b4c3" }
auth-policy = { git = "https://github.com/peios/authd.git", rev = "327ce68648e1594331c88a457afb261f9000b4c3" }
axum = { version = "0.8.9" }
base64 = { version = "0.22" }
eventd-client = { git = "https://github.com/peios/eventd.git", rev = "f74954f969626352915b3885848b6e21d3492c3f" }
gxwi-file-dialog = { path = "apps/gxwi-file-dialog", default-features = false }
gxwi-sd-editor = { path = "apps/gxwi-sd-editor", default-features = false }
jiff = { version = "0.2.29" }
libc = { version = "0.2" }
gxwi = { git = "https://github.com/peios/gxwi.git", rev = "0cdbd97c86ca0e78138c6b320d88d5be8e2a6407" }
netd-client = { git = "https://github.com/peios/netd.git", rev = "f7877024edb0981b42de762ad80fa5b3ef021988" }
resolvd-client = { git = "https://github.com/peios/resolvd.git", rev = "fc186928efc8b2201f9a3d1d9b4ea4bc55342a37" }
timed-client = { git = "https://github.com/peios/timed.git", rev = "e29e2248828e19fcd9566c352d6eade15331cfce" }
ntfe = { path = "vendor/kernel/peios/rust/ntfe" }
peinit2 = { git = "https://github.com/peios/peinit.git", rev = "8ff7155b87e1f8c03ce78baf64d8d7b5425fbe3a", default-features = false }
peios = { git = "https://github.com/peios/peios-rs.git", rev = "623520bc0405fdd4526bab45f45882e7f19b1ab1", package = "peios" }
peios-reg = { git = "https://github.com/peios/peiosutils.git", rev = "43c22a9435e194da375ed24f149cbecc140b9ffa" }
peios-regman = { git = "https://github.com/peios/peiosutils.git", rev = "43c22a9435e194da375ed24f149cbecc140b9ffa" }
pnp-core = { path = "vendor/kernel/peios/rust/pnp-core" }
serde = { version = "1" }
serde_json = { version = "1" }
session-preferences = { git = "https://github.com/peios/authd.git", rev = "327ce68648e1594331c88a457afb261f9000b4c3" }
sha1 = { version = "0.10" }
tokio = { version = "1.53.1" }
trust-client = { git = "https://github.com/peios/trustd.git", rev = "fad1b50c4949232b6c608d7bc3a36407559c0e83" }
vt100 = { version = "0.16" }

[patch."https://github.com/peios/pkm.git"]
pnp-core = { path = "vendor/kernel/peios/rust/pnp-core" }
ntfe = { path = "vendor/kernel/peios/rust/ntfe" }
peios-uapi = { path = "vendor/kernel/peios/rust/peios-uapi" }
