[workspace]
resolver = "3"
members = [
    "vendor/kernel/peios/rust/ntfe",
    "vendor/kernel/peios/rust/pnp-core",
    "vendor/kernel/peios/rust/peios-uapi",
    "crates/gxwi-fs",
    "crates/gxwi-process",
    "apps/gxwi-disk-manager",
    "apps/gxwi-event-viewer",
    "apps/gxwi-feature-manager",
    "apps/gxwi-file-dialog",
    "apps/gxwi-file-explorer",
    "apps/gxwi-my-settings",
    "apps/gxwi-network-manager",
    "apps/gxwi-package-manager",
    "apps/gxwi-principals-manager",
    "apps/gxwi-registry-editor",
    "apps/gxwi-sd-editor",
    "apps/gxwi-security-policy",
    "apps/gxwi-services-manager",
    "apps/gxwi-system-settings",
    "apps/gxwi-task-manager",
    "apps/gxwi-terminal",
    "apps/gxwi-text-editor",
    "apps/gxwi-upgrade-peios",
]
exclude = ["vendor/ppk"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"

[workspace.dependencies]
gxwi-fs = { path = "crates/gxwi-fs" }
gxwi-process = { path = "crates/gxwi-process" }
auth-core = { git = "https://github.com/peios/authd.git", rev = "dc1ff5bb0b1c4b29b6d88a72cdcb86f0de7e5003" }
auth-policy = { git = "https://github.com/peios/authd.git", rev = "dc1ff5bb0b1c4b29b6d88a72cdcb86f0de7e5003" }
axum = { version = "0.8.9" }
base64 = { version = "0.22" }
eventd-client = { git = "https://github.com/peios/eventd.git", rev = "50132adfc61418b0d089aaf4c9df8155d357aae2" }
gxwi-file-dialog = { path = "apps/gxwi-file-dialog", default-features = false }
gxwi-sd-editor = { path = "apps/gxwi-sd-editor", default-features = false }
jiff = { version = "0.2.29" }
libc = { version = "0.2" }
gxwi = { git = "https://github.com/peios/gxwi.git", rev = "e6f57071453efb02f3ccb72ada1345d7a1967fd1" }
netd-client = { git = "https://github.com/peios/netd.git", rev = "d9a605dd335c35f64468a298cfb367c2730d6c48" }
resolvd-client = { git = "https://github.com/peios/resolvd.git", rev = "23a2eb62899739b4fd58ba9e8fb782f3077d4804" }
timed-client = { git = "https://github.com/peios/timed.git", rev = "aee10c809f2cda117cbc0196ce4aa586ddf3d60b" }
ntfe = { path = "vendor/kernel/peios/rust/ntfe" }
peinit2 = { git = "https://github.com/peios/peinit.git", rev = "7e8eeb82ab8491d3f29b400edfd86c5e8e279446", default-features = false }
peios = { git = "https://github.com/peios/peios-rs.git", rev = "4c9c0106550e3b7d8b4a98dfd0d7a5490fcf0116", package = "peios" }
peios-reg = { git = "https://github.com/peios/peiosutils.git", rev = "80ed3cdd7e3e01a49da05ab8d2f29ba330a140cc" }
peios-regman = { git = "https://github.com/peios/peiosutils.git", rev = "80ed3cdd7e3e01a49da05ab8d2f29ba330a140cc" }
pnp-core = { path = "vendor/kernel/peios/rust/pnp-core" }
serde = { version = "1" }
serde_json = { version = "1" }
session-preferences = { git = "https://github.com/peios/authd.git", rev = "dc1ff5bb0b1c4b29b6d88a72cdcb86f0de7e5003" }
sha1 = { version = "0.10" }
tokio = { version = "1.53.1" }
trust-client = { git = "https://github.com/peios/trustd.git", rev = "b6a761e5a221173ba1b3c691c03977ce8cf60721" }
vt100 = { version = "0.16" }

[patch."https://github.com/peios/pkm.git"]
pnp-core = { path = "vendor/kernel/peios/rust/pnp-core" }
ntfe = { path = "vendor/kernel/peios/rust/ntfe" }
peios-uapi = { path = "vendor/kernel/peios/rust/peios-uapi" }
