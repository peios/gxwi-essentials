name: GXWI Essentials build and tests

on:
    pull_request:
    push:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: gxwi-essentials-check-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  persist-credentials: false
            - name: Install Linux development tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential libclang-dev pkg-config python3 python3-venv binutils groff nodejs npm
                  rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
            # A read-only selected-repository token is needed for the private GXWI
            # dependency. The default checkout token cannot read another repo.
            - name: Configure private dependency access
              env:
                  PEIOS_DEPENDENCIES_TOKEN: ${{ secrets.PEIOS_DEPENDENCIES_TOKEN }}
              run: |
                  test -n "$PEIOS_DEPENDENCIES_TOKEN" || {
                      echo "Configure PEIOS_DEPENDENCIES_TOKEN with read-only access to peios/gxwi." >&2
                      exit 1
                  }
                  helper="$RUNNER_TEMP/gxwi-essentials-git-credentials"
                  cat > "$helper" <<'CREDENTIALS'
                  #!/bin/sh
                  while IFS= read -r line && [ -n "$line" ]; do
                      case "$line" in
                          protocol=*) protocol=${line#protocol=} ;;
                          host=*) host=${line#host=} ;;
                          path=*) path=${line#path=} ;;
                      esac
                  done
                  if [ "$1" = get ] && [ "$protocol" = https ] && [ "$host" = github.com ] && [ "$path" = peios/gxwi.git ]; then
                      printf 'username=x-access-token\npassword=%s\n' "$PEIOS_DEPENDENCIES_TOKEN"
                  fi
                  CREDENTIALS
                  chmod 700 "$helper"
                  git config --global credential.https://github.com.useHttpPath true
                  git config --global credential.helper "$helper"
            - name: Select the shared JavaScript runtime
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
              with:
                  node-version: "22.22.1"
            - name: Prepare pinned PSC style tools
              run: python3 tools/prepare-style-tools.py "$RUNNER_TEMP/gxwi-essentials-style"
            - name: Check out the native SDK library
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  repository: peios/libpeios
                  ref: 3f2ce51c7cfc27644f72a053ca01888736905064
                  path: .ci-sdk/libpeios
                  persist-credentials: false
            - name: Check out the kernel UAPI
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  repository: peios/kernel
                  ref: 9759ae740f2a194e8f7c63dd7d88cd31604bf044
                  path: .ci-sdk/kernel
                  sparse-checkout: include/uapi/pkm
                  persist-credentials: false
            - name: Read the locked GXWI revision
              id: gxwi
              run: |
                  python3 - <<'PY_REVISION' >> "$GITHUB_OUTPUT"
                  import tomllib
                  from pathlib import Path
                  config = tomllib.loads(Path("Cargo.toml").read_text())
                  print("revision=" + config["workspace"]["dependencies"]["gxwi"]["rev"])
                  PY_REVISION
            - name: Check out the shared GXWI library
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  repository: peios/gxwi
                  ref: ${{ steps.gxwi.outputs.revision }}
                  token: ${{ secrets.PEIOS_DEPENDENCIES_TOKEN }}
                  path: .ci-sdk/gxwi
                  persist-credentials: false
            - name: Prepare the development SDK
              run: |
                  tools/prepare-dev-sdk .ci-sdk/libpeios .ci-sdk/kernel/include/uapi "$RUNNER_TEMP/peios-sdk"
                  tools/prepare-gxwi-sdk .ci-sdk/gxwi "$RUNNER_TEMP/peios-sdk"
            - name: Check style, build, tests and packages
              env:
                  PEIOS_DEPENDENCIES_TOKEN: ${{ secrets.PEIOS_DEPENDENCIES_TOKEN }}
                  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
                  PEIOS_SDK: ${{ runner.temp }}/peios-sdk
                  PEIOS_STYLE_BIN: ${{ runner.temp }}/gxwi-essentials-style/bin
                  CARGO_TARGET_DIR: ${{ runner.temp }}/gxwi-essentials-cargo-checks
              run: tools/check
            - name: Check out the documentation compiler
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  repository: peios/trail
                  ref: 1d662e98cbcbdd5c51c01533afcab7f5723a2eff
                  path: .ci-sdk/trail
                  persist-credentials: false
            - name: Build the pinned documentation compiler
              working-directory: .ci-sdk/trail
              run: tools/bazel build //:trail
            - name: Check documentation
              env:
                  TRAIL: ${{ github.workspace }}/.ci-sdk/trail/bazel-bin/trail
              run: tools/check-docs
